name: CI

on:
  push:
    branches:
      - main
      - renovate/**

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Verify
    runs-on: macos-26
    permissions:
      contents: write # Submit dependency graph snapshots
    steps:
    - name: Setup build environment
      uses: $/.github/reusable-workflows/setup-gradle
      with:
        fetch-depth: 0
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        dependency-graph: generate-and-submit

    - name: Check changelog format
      id: changelog
      uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
      with:
        path: ./CHANGELOG.md
        version: Unreleased
        validation_level: error

    - name: Check Play Store release notes length
      env:
        CHANGELOG: ${{ steps.changelog.outputs.changes }}
      run: |
        python3 -c '
        import os
        import sys

        # release.yml writes the action output followed by a newline.
        count = len(os.environ["CHANGELOG"]) + 1
        print(f"Play Store release notes: {count}/500 characters")
        if count > 500:
            sys.exit("Play Store release notes exceed 500 characters")
        '

    - name: Run unit tests
      run: ./gradlew --no-configuration-cache --stacktrace :build-logic:check check validateDebugScreenshotTest -PslimTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: (Fail-only) Upload test report
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
          name: Test report
          path: '**/build/reports/tests/**'

  dependency-review:
    name: Review dependencies
    runs-on: macos-26
    permissions:
      contents: read
    if: "github.event_name == 'push' && github.event.ref != 'refs/heads/main'"
    needs:
      - check
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          base-ref: refs/heads/main
          head-ref: ${{ github.ref }}

  release-app:
    name: Build release app
    runs-on: macos-26
    permissions:
      contents: read
    needs:
      - check
    steps:
      - name: Setup build environment
        uses: $/.github/reusable-workflows/setup-gradle
        with:
          cache-read-only: true

      - name: Build release app
        run: |
          ./scripts/setup-age.sh
          ./scripts/signing-setup.sh "$AGE_SECRET_KEY"
          ./gradlew --no-configuration-cache --stacktrace assembleFossRelease assembleGplayRelease collectGplayReleaseBundle
          ./scripts/signing-cleanup.sh
        env:
          AGE_SECRET_KEY: ${{ secrets.AGE_SECRET_KEY }}
